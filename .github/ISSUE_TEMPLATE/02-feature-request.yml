name: "功能建议 / Feature request"
description: "提出新功能或现有工作流的改进 / Suggest an improvement."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        中文、English、日本語均可。请围绕一个使用场景说明需求，具体实现方案可留给讨论。
        Describe one use case. You do not need to design the implementation.
        正文与附件公开可见，请勿包含私人作品或账号资料。
  - type: textarea
    id: problem
    attributes:
      label: "使用场景与遇到的困难 / Use case and problem"
      placeholder: "想完成什么任务？现有流程在哪一步不方便？ / What are you trying to do, and where does the current workflow fall short?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "期望的改进 / Proposed improvement"
      placeholder: "希望操作后出现什么行为？如有参考项目，请附链接并说明参考点。 / Describe the desired behavior and relevant references."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案与补充 / Alternatives and context"
      description: "可选：现在如何绕过问题、相关 Issue、草图或不涉及私人内容的示例。 / Optional workarounds, related issues or examples."
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: "提交前检查 / Before submitting"
      options:
        - label: "我已搜索现有建议，并确认正文和附件可以公开。 / I searched existing requests and checked that this post can be public."
          required: true
